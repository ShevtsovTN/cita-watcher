# cita-watcher-docker/docker-compose.yml
#
# Расположение: ./cita-watcher-docker/docker-compose.yml — все относительные пути ниже считаются
# от этой директории. Запускать так: docker compose -f cita-watcher-docker/docker-compose.yml up -d
# (или создать симлинк/alias, если удобнее запускать из корня репозитория).
#
# Layout монорепозитория:
#   ../application  — Laravel-приложение (Domain/Application/Infrastructure/Presentation)
#   ../node-worker  — Playwright + CDP screencast relay (TypeScript)
#   .               — Dockerfile'ы, конфиги инфраструктуры, cita-watcher-docker/.env (переменные compose)
#
# Два разных .env:
#   cita-watcher-docker/.env — переменные ДЛЯ САМОГО compose (подстановка ${DB_PASSWORD} и т.п.)
#   application/.env         — рантайм-конфиг Laravel, читается фреймворком из bind-mount'а,
#                            сюда НЕ переносим и явно не подключаем через env_file
#
# Сервисы:
#   nginx           — веб-сервер, отдаёт Laravel + проксирует CDP-screencast WS
#   app             — php-fpm, само Laravel-приложение
#   queue-worker    — обработка исходящих команд к Node-воркеру (Laravel Queue)
#   event-consumer  — приём событий (CheckCompleted/CaptchaRequired/CheckFailed) от Node-воркера
#   scheduler       — планировщик (php artisan schedule:work)
#   node-worker     — Playwright + CDP screencast relay, реальные проверки на сайте sede...
#   redis           — очередь команд + pub/sub событий между Laravel и Node
#   db              — Postgres, хранение WatchTask/логов/зашифрованных данных заявителя

x-app-build: &app-build
  context: ../application
  dockerfile: ../cita-watcher-docker/app/Dockerfile
  # php.ini лежит в cita-watcher-docker/app/, вне основного контекста (../application) —
  # подключаем docker/app/ отдельным именованным контекстом, чтобы
  # `COPY --from=phpconfig php.ini ...` в Dockerfile мог его найти.
  additional_contexts:
    - phpconfig=./app

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      node-worker:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../application:/var/www/html:ro # bind-mount, nginx нужен только public/ на чтение
    networks:
      - cita-net

  app:
    build: *app-build
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../application:/var/www/html # bind-mount: изменения кода видны без ребилда
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cita-net

  queue-worker:
    build: *app-build
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=watcher-commands", "--tries=3", "--timeout=90"]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../application:/var/www/html
    depends_on:
      app:
        condition: service_started
    networks:
      - cita-net

  event-consumer:
    build: *app-build
    restart: unless-stopped
    command: ["php", "artisan", "watcher:consume-events"]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../application:/var/www/html
    depends_on:
      app:
        condition: service_started
    networks:
      - cita-net

  scheduler:
    build: *app-build
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ../application:/var/www/html
    depends_on:
      app:
        condition: service_started
    networks:
      - cita-net

  node-worker:
    build:
      context: ../node-worker
      dockerfile: ../cita-watcher-docker/node-worker/Dockerfile
    # `xvfb-run` (see `command:` below) waits for Xvfb to signal readiness via SIGUSR1 before
    # running the wrapped command — confirmed live (2026-08-08) that this hangs forever when
    # `xvfb-run` itself is the container's PID 1: Xvfb starts fine (its own lock file appears), but
    # PID 1 never receives/acts on the signal without a real init reaping/forwarding it. `init: true`
    # makes Compose run a minimal init (tini) as PID 1 instead, which fixes exactly this class of
    # PID-1 signal-handling gotcha — confirmed live this actually unblocks it.
    init: true
    # xvfb-run: automation/session-manager.ts launches Chromium with headless: false (see
    # ../docs/NODE_WORKER_ROADMAP.md Phase 9 — plain headless never got past the target site's own
    # bot defense in live testing, headed-under-a-virtual-display did), which needs a DISPLAY. This
    # `command:` override replaces the Dockerfile's CMD, so it needs its own xvfb-run wrapping too —
    # the Dockerfile's isn't inherited here.
    command: ["xvfb-run", "-a", "npm", "run", "dev"]
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      # Laravel's redis client prefixes every key/channel (config('database.redis.options.prefix'),
      # default Str::slug(APP_NAME)-database- — see ../docs/PHASE9_DRY_RUN.md). Must match
      # application/.env's APP_NAME/REDIS_PREFIX; update both together if either changes.
      REDIS_KEY_PREFIX: laravel-database-
      CDP_RELAY_PORT: ${CDP_RELAY_PORT:-4001}
      HEALTH_PORT: ${HEALTH_PORT:-4002}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-3}
    volumes:
      - ../node-worker:/usr/src/app # bind-mount: живая разработка без ребилда образа
      - node-worker-modules:/usr/src/app/node_modules # именованный volume, чтобы bind-mount не затирал node_modules из образа
    shm_size: "1gb" # Chromium требует увеличенный /dev/shm
    healthcheck:
      # Plain `node -e` hitting src/index.ts's HttpHealthServer — no curl/wget dependency needed
      # on the Playwright base image. Reports unhealthy if either Redis client isn't "ready".
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${HEALTH_PORT:-4002}', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s # first boot launches Chromium + connects two Redis clients
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cita-net

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379" # dev-only: lets host tools (PhpStorm) connect
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cita-net

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cita_watcher}
      POSTGRES_USER: ${DB_USERNAME:-cita_watcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in docker/.env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432" # dev-only: lets host tools (PhpStorm, psql) connect
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cita_watcher}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cita-net

volumes:
  node-worker-modules:
  redis-data:
  db-data:

networks:
  cita-net:
    driver: bridge